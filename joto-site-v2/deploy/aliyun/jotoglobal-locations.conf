location = /api/captcha {
    proxy_pass https://admin.jotoai.com/api/captcha;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name admin.jotoai.com;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host admin.jotoai.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Authorization "";
    proxy_set_header Proxy-Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}

location = /api/contact {
    limit_req zone=jotoglobal_contact burst=5 nodelay;
    proxy_pass https://admin.jotoai.com/api/contact;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name admin.jotoai.com;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_set_header Host admin.jotoai.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Authorization "";
    proxy_set_header Proxy-Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}

location = /healthz {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 200 '{"ok":true,"contactBackend":"admin.jotoai.com"}';
}

location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/jotoglobal-security-headers.conf;
    access_log off;
}

location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    include /etc/nginx/snippets/jotoglobal-security-headers.conf;
}

location = /robots.txt {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300" always;
    include /etc/nginx/snippets/jotoglobal-security-headers.conf;
}

location = /sitemap.xml {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300" always;
    include /etc/nginx/snippets/jotoglobal-security-headers.conf;
}

location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/jotoglobal-security-headers.conf;
}
